name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the last commit

      - name: Scan for secrets with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose --no-banner

      - name: Block committed secret files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.(jks|keystore|p12|pem|key)$|(^|/)(local|keystore|signing)\.properties$|(^|/)(photos|backups|screenshots|user-content)/' | grep -vE '(^|/)\.env\.example$'; then
            echo "::error::Secret/config files or user photos/backups/screenshots are tracked in git (listed above). Remove them and rotate any exposed values."
            exit 1
          fi
