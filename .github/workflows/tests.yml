name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    # Runs the Bash scripts and, via preinstalled pwsh 7, the PowerShell scripts.
    runs-on: ubuntu-latest
    env:
      TV_TEST_POWERSHELL: pwsh
      TV_TEST_REQUIRE_POWERSHELL: "1" # fail, never skip, if PowerShell is missing
      TV_TEST_REQUIRE_BASH: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests -v

  windows:
    # The only place the .ps1 scripts run on Windows PowerShell 5.1 (powershell.exe, not pwsh).
    runs-on: windows-latest
    env:
      TV_TEST_POWERSHELL: powershell
      TV_TEST_REQUIRE_POWERSHELL: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
