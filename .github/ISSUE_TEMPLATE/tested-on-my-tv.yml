name: Tested on my TV
description: Tell us whether it worked on your TV. It feeds the "Tested on" table in the README.
labels: ["tested-on"]
body:
  - type: markdown
    attributes:
      value: |
        ## Please don't paste your IP address, serial number, photos or backup files.
        Only the details asked for below.
  - type: input
    id: model
    attributes:
      label: TV brand and model
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "e.g. Android 11"
    validations:
      required: true
  - type: dropdown
    id: google_tv
    attributes:
      label: Google TV?
      options: ["Yes", "No"]
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options: ["Works", "Works with problems", "Didn't work"]
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date you tested (YYYY-MM-DD)
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
